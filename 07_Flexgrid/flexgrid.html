<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            background-color: red;
            height: 100px;
            padding: 10px;
            box-sizing: border-box;
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-auto-rows: minmax(400px, auto);
            column-gap: 1px;
            row-gap: 1px;
        }

        .item1 {
            grid-column: span 2;
        }

        .item2 {
            grid-row-start: span2;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box item1">eins</div>
        <div class="box item2">zwei</div>
        <div class="box item3">drei</div>
        <div class="box item4">vier</div>
        <div class="box item5">Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptatibus nam adipisci
            asperiores ipsa quas magni corporis, dolore nesciunt ut magnam veniam quos perspiciatis modi vitae soluta
            qui repellat cumque maxime!</div>



    </div>
</body>

</html>
